services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: champy-db
    environment:
      POSTGRES_USER: champy_user
      POSTGRES_PASSWORD: champy_password
      POSTGRES_DB: champy_championship
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001-initial-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champy_user -d champy_championship"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - champy-network

  # Backend Node.js
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: champy-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: champy_user
      DB_PASSWORD: champy_password
      DB_NAME: champy_championship
      JWT_SECRET: dev-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - champy-network
    command: node src/server.js

volumes:
  postgres_data:

networks:
  champy-network:
    driver: bridge
